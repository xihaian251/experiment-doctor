name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests (synthetic fixtures only)
        run: python -m pytest -q
      - name: Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Mypy
        run: python -m mypy src scripts tests

  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build
        run: pip install build
      - name: Build wheel + sdist
        run: python -m build
      - name: Inspect metadata
        run: |
          python - <<'EOF'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          meta = zipfile.ZipFile(whl).read(
              [n for n in zipfile.ZipFile(whl).namelist() if n.endswith("METADATA")][0]
          ).decode()
          assert "Version: 0.1.0" in meta or "Version:" in meta
          assert "Name: experiment-doctor" in meta
          print(meta.splitlines()[:8])
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
